name: Release
on:
  push:
    branches: [plasmon]
    tags: ["v*"]
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Never publish to Sonatype Central from two jobs at a time. A job waits for the
    # running one rather than cancelling it. GitHub keeps only one waiting job per
    # group though, and cancels an older waiting one.
    concurrency:
      group: sonatype-central-publish-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: coursier/cache-action@v9
      - name: Publish to Sonatype
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/ --bundleName "metals-${GITHUB_REF#refs/tags/v}" --shouldRelease false
          else
            for tag in $(git tag --points-at HEAD); do
              git tag -d "$tag"
            done
            ./mill -i mill.scalalib.SonatypeCentralPublishModule/
          fi
        env:
          MILL_PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
          MILL_PGP_SECRET_BASE64: ${{ secrets.PUBLISH_SECRET_KEY_BASE64 }}
          MILL_SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
          MILL_SONATYPE_USERNAME: ${{ secrets.PUBLISH_USER }}
      - name: Publish to GitHub Packages
        continue-on-error: true
        run: |
          ./mill -i mill.javalib.MavenPublishModule/publishAll \
            --publishArtifacts "__:PublishModule.publishArtifacts" \
            --releaseUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY" \
            --snapshotUri "https://maven.pkg.github.com/$GITHUB_REPOSITORY"
        env:
          MILL_MAVEN_USERNAME: ${{ github.actor }}
          MILL_MAVEN_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
