name: Release
on:
  push:
    branches: [plasmon]
    tags: ["**"]
concurrency:
  group: release-${{ github.ref }}
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          # Do not change the version of Java, it is the minimal version Metals works with
          java-version: 17
          cache: 'sbt'
      - uses: sbt/setup-sbt@v1
      - name: Publish to Sonatype
        run: sbt ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PUBLISH_SECRET_KEY_PASSWORD }}
          PGP_SECRET: ${{ secrets.PUBLISH_SECRET_KEY }}
          SONATYPE_PASSWORD: ${{ secrets.PUBLISH_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.PUBLISH_USERNAME }}
